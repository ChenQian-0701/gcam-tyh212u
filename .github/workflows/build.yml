name: build-and-check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/setup_sdk.py --sdk "$RUNNER_TEMP/gcam-sdk"
      - run: python3 tools/build_module.py --sdk "$RUNNER_TEMP/gcam-sdk" --mode unsigned
      - run: python3 tools/check_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-module-not-installable
          path: dist/*unsigned.apk
